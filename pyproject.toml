[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rInverseGaussian"
version = "0.2.0"
description = "Mode-parameterized inverse Gaussian distributions and response-time mixtures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.urls]
Repository = "https://github.com/kevinzagalo/rInverseGaussian"

[tool.setuptools]
packages = ["rInverseGaussian"]

[tool.setuptools.package-dir]
rInverseGaussian = "."
